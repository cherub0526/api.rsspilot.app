; Queue    : videotranscriber.archive
; Job(s)   : VideoTranscriberArchiveJob
; Downloads the transcripts, subtitles and the mp3 onto S3. Measured 10s for a
; 46-minute episode (13.9MB); the job caps itself at 180s of downloads so a
; slow CDN cannot push a single run near this --timeout.
;
; Parameter relationship that must hold (see README.md):
;   --timeout (300) < DB_QUEUE_RETRY_AFTER < stopwaitsecs (360)

[program:videotranscriber-archive]
directory=/home/forge/catchupai-api.on-forge.com/
command=php8.4 /home/forge/catchupai-api.on-forge.com/artisan queue:work database --queue='videotranscriber.archive' --sleep=3 --timeout=300 --max-time=3600 --memory=256
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
user=forge
numprocs=2
redirect_stderr=true
stdout_logfile=/home/forge/.forge/videotranscriber-archive.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stopwaitsecs=360
stopasgroup=true
killasgroup=true
