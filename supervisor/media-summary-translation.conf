; Queue    : media.summary-translation
; Job(s)   : SummaryTranslationJob
; One OpenRouter call per job, capped at 60s by Completion's own HTTP timeout;
; 120 leaves room for the DB writes around it.
;
; Parameter relationship that must hold (see README.md):
;   --timeout (120) < DB_QUEUE_RETRY_AFTER < stopwaitsecs (360)

[program:media-summary-translation]
directory=/home/forge/catchupai-api.on-forge.com/
command=php8.4 /home/forge/catchupai-api.on-forge.com/artisan queue:work database --queue='media.summary-translation' --sleep=3 --timeout=120 --max-time=3600 --memory=256
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
user=forge
numprocs=2
redirect_stderr=true
stdout_logfile=/home/forge/.forge/media-summary-translation.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stopwaitsecs=360
stopasgroup=true
killasgroup=true
