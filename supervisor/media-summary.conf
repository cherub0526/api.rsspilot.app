; Queue    : media.summary
; Job(s)   : SummaryJob
; OpenAI completion; a long transcript can take minutes.
;
; Parameter relationship that must hold (see README.md):
;   --timeout (300) < DB_QUEUE_RETRY_AFTER < stopwaitsecs (360)

[program:media-summary]
directory=/home/forge/catchupai-api.on-forge.com/
command=php8.4 /home/forge/catchupai-api.on-forge.com/artisan queue:work database --queue='media.summary' --sleep=3 --timeout=300 --max-time=3600 --memory=256
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
user=forge
numprocs=2
redirect_stderr=true
stdout_logfile=/home/forge/.forge/media-summary.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stopwaitsecs=360
stopasgroup=true
killasgroup=true
