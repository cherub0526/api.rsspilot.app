; Queue    : videotranscriber.smart-summary
; Job(s)   : VideoTranscriberSmartSummaryJob
; Measured 14-31s against production; 300 leaves headroom.
;
; --max-time 已於 2026-09-18 拿掉：到期時 Worker::stop() 不會結束 process
; （Swoole timer 沒清），worker 會變成「還活著但不再領 job」。見 README.md。
;
; Parameter relationship that must hold (see README.md):
;   --timeout (300) < DB_QUEUE_RETRY_AFTER < stopwaitsecs (360)

[program:videotranscriber-smart-summary]
directory=/home/forge/catchupai-api.on-forge.com/
command=php8.4 /home/forge/catchupai-api.on-forge.com/artisan queue:work database --queue='videotranscriber.smart-summary' --sleep=3 --timeout=300 --memory=256
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
user=forge
numprocs=2
redirect_stderr=true
stdout_logfile=/home/forge/.forge/videotranscriber-smart-summary.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stopwaitsecs=360
stopasgroup=true
killasgroup=true
