; Queue    : media.notify
; Job(s)   : DailyDigestJob
; media:notify 每天 09:00 一次派完全部使用者，之後整天閒置。
;
; Parameter relationship that must hold (see README.md):
;   --timeout (120) < DB_QUEUE_RETRY_AFTER < stopwaitsecs (180)

[program:media-notify]
directory=/home/forge/catchupai-api.on-forge.com/
command=php8.4 /home/forge/catchupai-api.on-forge.com/artisan queue:work database --queue='media.notify' --sleep=3 --timeout=120 --max-time=3600 --memory=256
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
user=forge
numprocs=2
redirect_stderr=true
stdout_logfile=/home/forge/.forge/media-notify.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stopwaitsecs=180
stopasgroup=true
killasgroup=true
