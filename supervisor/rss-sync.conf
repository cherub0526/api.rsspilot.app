; Queue    : rss.sync
; Job(s)   : SyncJob
; Walks a whole feed or playlist per run. Single process: runs are scheduled, not bursty.
;
; Parameter relationship that must hold (see README.md):
;   --timeout (300) < DB_QUEUE_RETRY_AFTER < stopwaitsecs (360)

[program:rss-sync]
directory=/home/forge/catchupai-api.on-forge.com/
command=php8.4 /home/forge/catchupai-api.on-forge.com/artisan queue:work database --queue='rss.sync' --sleep=3 --timeout=300 --max-time=3600 --memory=256
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
user=forge
numprocs=1
redirect_stderr=true
stdout_logfile=/home/forge/.forge/rss-sync.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stopwaitsecs=360
stopasgroup=true
killasgroup=true
