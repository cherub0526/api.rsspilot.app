; Queue    : videotranscriber.fetch
; Job(s)   : VideoTranscriberFetchJob
; Polls getTranscription and fetches the subtitle file from the CDN.
;
; Parameter relationship that must hold (see README.md):
;   --timeout (120) < DB_QUEUE_RETRY_AFTER < stopwaitsecs (180)

[program:videotranscriber-fetch]
directory=/home/forge/catchupai-api.on-forge.com/
command=php8.4 /home/forge/catchupai-api.on-forge.com/artisan queue:work database --queue='videotranscriber.fetch' --sleep=3 --timeout=120 --max-time=3600 --memory=256
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
user=forge
numprocs=2
redirect_stderr=true
stdout_logfile=/home/forge/.forge/videotranscriber-fetch.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stopwaitsecs=180
stopasgroup=true
killasgroup=true
